<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 236" width="600" height="236" role="img" aria-label="DialDo: Gives your Mac a phone number. Call it and a local-first agent finds files, summarizes PDFs, writes documents and sends email. PIN-gated, every action audited.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0b16"/><stop offset="1" stop-color="#11132a"/></linearGradient>
    <radialGradient id="glow" cx="12%" cy="40%" r="45%"><stop offset="0" stop-color="#ff6040" stop-opacity=".22"/><stop offset="1" stop-color="#ff6040" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6040" stop-opacity="0"/><stop offset=".5" stop-color="#ff6040" stop-opacity=".9"/><stop offset="1" stop-color="#ff6040" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-600 0;600 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="clip"><rect width="600" height="236" rx="16"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
    .rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="600" height="236" fill="url(#bg)"/>
    <rect width="600" height="236" fill="url(#glow)"/>
    <g opacity=".05" stroke="#f7f5f0"><path d="M 0 0 V 236"/><path d="M 40 0 V 236"/><path d="M 80 0 V 236"/><path d="M 120 0 V 236"/><path d="M 160 0 V 236"/><path d="M 200 0 V 236"/><path d="M 240 0 V 236"/><path d="M 280 0 V 236"/><path d="M 320 0 V 236"/><path d="M 360 0 V 236"/><path d="M 400 0 V 236"/><path d="M 440 0 V 236"/><path d="M 480 0 V 236"/><path d="M 520 0 V 236"/><path d="M 560 0 V 236"/><path d="M 600 0 V 236"/><path d="M 0 0 H 600"/><path d="M 0 40 H 600"/><path d="M 0 80 H 600"/><path d="M 0 120 H 600"/><path d="M 0 160 H 600"/><path d="M 0 200 H 600"/></g>
    <g transform="translate(22 58)">
    <g transform="translate(60 60)">
      <circle r="22" fill="none" stroke="#ff6040" stroke-width="1.5" opacity="0">
        <animate attributeName="r" values="22;56" dur="2.4s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".7;0" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle><circle r="22" fill="none" stroke="#ff6040" stroke-width="1.5" opacity="0">
        <animate attributeName="r" values="22;56" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".7;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle><circle r="22" fill="none" stroke="#ff6040" stroke-width="1.5" opacity="0">
        <animate attributeName="r" values="22;56" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".7;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle r="30" fill="#181713" stroke="#ff6040" stroke-opacity=".5" stroke-width="1.5"/>
      <rect x="-18.5" y="-6" width="5" height="12" rx="2.5" fill="#fff8eb">
        <animate attributeName="height" values="6;14;6" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-3;-7;-3" dur="0.9s" repeatCount="indefinite"/></rect><rect x="-10.5" y="-6" width="5" height="12" rx="2.5" fill="#fff8eb">
        <animate attributeName="height" values="6;26;6" dur="1.03s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-3;-13;-3" dur="1.03s" repeatCount="indefinite"/></rect><rect x="-2.5" y="-6" width="5" height="12" rx="2.5" fill="#fff8eb">
        <animate attributeName="height" values="6;34;6" dur="1.1600000000000001s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-3;-17;-3" dur="1.1600000000000001s" repeatCount="indefinite"/></rect><rect x="5.5" y="-6" width="5" height="12" rx="2.5" fill="#fff8eb">
        <animate attributeName="height" values="6;22;6" dur="1.29s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-3;-11;-3" dur="1.29s" repeatCount="indefinite"/></rect><rect x="13.5" y="-6" width="5" height="12" rx="2.5" fill="#fff8eb">
        <animate attributeName="height" values="6;12;6" dur="1.42s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-3;-6;-3" dur="1.42s" repeatCount="indefinite"/></rect>
    </g></g>
    <path d="M 150 30 V 206" stroke="#f7f5f0" stroke-opacity=".07"/>

    <g class="rise" style="animation-delay:.05s">
      <text class="m" x="170" y="42" font-size="11" letter-spacing="2.2" fill="#ff6040">VOICE AGENT · macOS</text>
    </g>
    <g class="rise" style="animation-delay:.15s">
      <text class="t" x="168" y="80" font-size="29" font-weight="700" fill="#f7f5f0" letter-spacing=".3">DialDo</text>
    </g>
    <g class="rise" style="animation-delay:.3s">
      <text class="t" x="170" y="110" font-size="13.5" fill="#a9a4b8">Gives your Mac a phone number. Call it and a local-first</text>
      <text class="t" x="170" y="130" font-size="13.5" fill="#a9a4b8">agent finds files, summarizes PDFs, writes documents and</text>
      <text class="t" x="170" y="150" font-size="13.5" fill="#a9a4b8">sends email. PIN-gated, every action audited.</text>
    </g>
    <g class="rise" style="animation-delay:.45s"><g transform="translate(170 190)"><rect width="87" height="22" rx="11" fill="#ff6040" fill-opacity=".09" stroke="#ff6040" stroke-opacity=".28"/><text x="43.5" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">TypeScript</text></g><g transform="translate(264 190)"><rect width="73.2" height="22" rx="11" fill="#ff6040" fill-opacity=".09" stroke="#ff6040" stroke-opacity=".28"/><text x="36.6" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">Electron</text></g><g transform="translate(344.2 190)"><rect width="59.400000000000006" height="22" rx="11" fill="#ff6040" fill-opacity=".09" stroke="#ff6040" stroke-opacity=".28"/><text x="29.700000000000003" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">Twilio</text></g><g transform="translate(410.6 190)"><rect width="80.1" height="22" rx="11" fill="#ff6040" fill-opacity=".09" stroke="#ff6040" stroke-opacity=".28"/><text x="40.05" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">LLM tools</text></g><g transform="translate(497.70000000000005 190)"><rect width="59.400000000000006" height="22" rx="11" fill="#ff6040" fill-opacity=".09" stroke="#ff6040" stroke-opacity=".28"/><text x="29.700000000000003" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">SQLite</text></g></g>

    <g transform="translate(511.6 24)">
      <rect width="66.4" height="24" rx="12" fill="#39d353" fill-opacity=".1" stroke="#39d353" stroke-opacity=".35"/>
      <circle class="pulse" cx="14" cy="12" r="4" fill="#39d353"/>
      <text class="m" x="24" y="16.5" font-size="11" letter-spacing="1.2" fill="#f7f5f0">LIVE</text>
    </g>
    <text class="m" x="576" y="186" text-anchor="end" font-size="11.5" fill="#ff6040" opacity=".9">dialdo.com ↗</text>
  </g>
  <rect x=".75" y=".75" width="598.5" height="234.5" rx="15.5" fill="none" stroke="#f7f5f0" stroke-opacity=".09" stroke-width="1.5"/>
  <rect x=".75" y=".75" width="598.5" height="234.5" rx="15.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
