<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 236" width="600" height="236" role="img" aria-label="TrailMail: Predicts work emails from public company patterns and sends personalized outreach through Gmail. Entirely client side, send-only OAuth scope, open and click tracking.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0b16"/><stop offset="1" stop-color="#11132a"/></linearGradient>
    <radialGradient id="glow" cx="12%" cy="40%" r="45%"><stop offset="0" stop-color="#ffab70" stop-opacity=".22"/><stop offset="1" stop-color="#ffab70" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffab70" stop-opacity="0"/><stop offset=".5" stop-color="#ffab70" stop-opacity=".9"/><stop offset="1" stop-color="#ffab70" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-600 0;600 0" dur="6.5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="clip"><rect width="600" height="236" rx="16"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
    .rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="600" height="236" fill="url(#bg)"/>
    <rect width="600" height="236" fill="url(#glow)"/>
    <g opacity=".05" stroke="#f7f5f0"><path d="M 0 0 V 236"/><path d="M 40 0 V 236"/><path d="M 80 0 V 236"/><path d="M 120 0 V 236"/><path d="M 160 0 V 236"/><path d="M 200 0 V 236"/><path d="M 240 0 V 236"/><path d="M 280 0 V 236"/><path d="M 320 0 V 236"/><path d="M 360 0 V 236"/><path d="M 400 0 V 236"/><path d="M 440 0 V 236"/><path d="M 480 0 V 236"/><path d="M 520 0 V 236"/><path d="M 560 0 V 236"/><path d="M 600 0 V 236"/><path d="M 0 0 H 600"/><path d="M 0 40 H 600"/><path d="M 0 80 H 600"/><path d="M 0 120 H 600"/><path d="M 0 160 H 600"/><path d="M 0 200 H 600"/></g>
    <g transform="translate(22 58)">
    <path id="tmArc" d="M -10 96 C 30 90, 60 40, 130 26" fill="none"/>
    <path d="M -10 96 C 30 90, 60 40, 130 26" fill="none" stroke="#ffab70" stroke-opacity=".18" stroke-dasharray="3 6"/>
    <g>
      <animateMotion dur="3.6s" repeatCount="indefinite" rotate="auto"><mpath href="#tmArc"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.8;1" dur="3.6s" repeatCount="indefinite"/>
      <path d="M -54 0 L -14 0" stroke="#ffab70" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
      <rect x="-13" y="-9" width="26" height="18" rx="3" fill="#ffab70"/>
      <path d="M -13 -8 L 0 2 L 13 -8" fill="none" stroke="#0a0b16" stroke-width="1.8" stroke-linejoin="round"/>
    </g></g>
    <path d="M 150 30 V 206" stroke="#f7f5f0" stroke-opacity=".07"/>

    <g class="rise" style="animation-delay:.05s">
      <text class="m" x="170" y="42" font-size="11" letter-spacing="2.2" fill="#ffab70">CHROME EXTENSION · OUTREACH</text>
    </g>
    <g class="rise" style="animation-delay:.15s">
      <text class="t" x="168" y="80" font-size="29" font-weight="700" fill="#f7f5f0" letter-spacing=".3">TrailMail</text>
    </g>
    <g class="rise" style="animation-delay:.3s">
      <text class="t" x="170" y="110" font-size="13.5" fill="#a9a4b8">Predicts work emails from public company patterns and</text>
      <text class="t" x="170" y="130" font-size="13.5" fill="#a9a4b8">sends personalized outreach through Gmail. Entirely client</text>
      <text class="t" x="170" y="150" font-size="13.5" fill="#a9a4b8">side, send-only OAuth scope, open and click tracking.</text>
    </g>
    <g class="rise" style="animation-delay:.45s"><g transform="translate(170 190)"><rect width="87" height="22" rx="11" fill="#ffab70" fill-opacity=".09" stroke="#ffab70" stroke-opacity=".28"/><text x="43.5" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">JavaScript</text></g><g transform="translate(264 190)"><rect width="87" height="22" rx="11" fill="#ffab70" fill-opacity=".09" stroke="#ffab70" stroke-opacity=".28"/><text x="43.5" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">Chrome MV3</text></g><g transform="translate(358 190)"><rect width="80.1" height="22" rx="11" fill="#ffab70" fill-opacity=".09" stroke="#ffab70" stroke-opacity=".28"/><text x="40.05" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">Gmail API</text></g><g transform="translate(445.1 190)"><rect width="52.5" height="22" rx="11" fill="#ffab70" fill-opacity=".09" stroke="#ffab70" stroke-opacity=".28"/><text x="26.25" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">OAuth</text></g></g>

    <g transform="translate(511.6 24)">
      <rect width="66.4" height="24" rx="12" fill="#39d353" fill-opacity=".1" stroke="#39d353" stroke-opacity=".35"/>
      <circle class="pulse" cx="14" cy="12" r="4" fill="#39d353"/>
      <text class="m" x="24" y="16.5" font-size="11" letter-spacing="1.2" fill="#f7f5f0">LIVE</text>
    </g>
    <text class="m" x="576" y="186" text-anchor="end" font-size="11.5" fill="#ffab70" opacity=".9">trailmails.com ↗</text>
  </g>
  <rect x=".75" y=".75" width="598.5" height="234.5" rx="15.5" fill="none" stroke="#f7f5f0" stroke-opacity=".09" stroke-width="1.5"/>
  <rect x=".75" y=".75" width="598.5" height="234.5" rx="15.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
