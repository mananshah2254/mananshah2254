<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 236" width="600" height="236" role="img" aria-label="Repo Run: Know what a repo needs before you run it. Reads manifests, checks your machine for missing runtimes and version conflicts, and previews every command before it runs.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0b16"/><stop offset="1" stop-color="#11132a"/></linearGradient>
    <radialGradient id="glow" cx="12%" cy="40%" r="45%"><stop offset="0" stop-color="#8fd3a8" stop-opacity=".22"/><stop offset="1" stop-color="#8fd3a8" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fd3a8" stop-opacity="0"/><stop offset=".5" stop-color="#8fd3a8" stop-opacity=".9"/><stop offset="1" stop-color="#8fd3a8" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-600 0;600 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="clip"><rect width="600" height="236" rx="16"/></clipPath>
  </defs>
