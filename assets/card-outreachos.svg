<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 236" width="600" height="236" role="img" aria-label="OutreachOS: Multi-step LinkedIn cadence engine: visit, connect, message, follow up. Sequenced with delays, daily caps and warm-up, running in your own browser session.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0b16"/><stop offset="1" stop-color="#11132a"/></linearGradient>
    <radialGradient id="glow" cx="12%" cy="40%" r="45%"><stop offset="0" stop-color="#8ab4ff" stop-opacity=".22"/><stop offset="1" stop-color="#8ab4ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ab4ff" stop-opacity="0"/><stop offset=".5" stop-color="#8ab4ff" stop-opacity=".9"/><stop offset="1" stop-color="#8ab4ff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-600 0;600 0" dur="6.8s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="clip"><rect width="600" height="236" rx="16"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
    .rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="600" height="236" fill="url(#bg)"/>
    <rect width="600" height="236" fill="url(#glow)"/>
    <g opacity=".05" stroke="#f7f5f0"><path d="M 0 0 V 236"/><path d="M 40 0 V 236"/><path d="M 80 0 V 236"/><path d="M 120 0 V 236"/><path d="M 160 0 V 236"/><path d="M 200 0 V 236"/><path d="M 240 0 V 236"/><path d="M 280 0 V 236"/><path d="M 320 0 V 236"/><path d="M 360 0 V 236"/><path d="M 400 0 V 236"/><path d="M 440 0 V 236"/><path d="M 480 0 V 236"/><path d="M 520 0 V 236"/><path d="M 560 0 V 236"/><path d="M 600 0 V 236"/><path d="M 0 0 H 600"/><path d="M 0 40 H 600"/><path d="M 0 80 H 600"/><path d="M 0 120 H 600"/><path d="M 0 160 H 600"/><path d="M 0 200 H 600"/></g>
    <g transform="translate(22 58)">
    <g transform="translate(0 60)">
      <path d="M 16 0 H 104" stroke="#8ab4ff" stroke-opacity=".25" stroke-width="2"/>
      <circle cx="16" cy="0" r="9" fill="#0a0b16" stroke="#8ab4ff" stroke-width="2"/>
        <circle cx="16" cy="0" r="4" fill="#8ab4ff" opacity=".2"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" begin="0s" repeatCount="indefinite"/></circle><circle cx="45" cy="0" r="9" fill="#0a0b16" stroke="#8ab4ff" stroke-width="2"/>
        <circle cx="45" cy="0" r="4" fill="#8ab4ff" opacity=".2"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></circle><circle cx="75" cy="0" r="9" fill="#0a0b16" stroke="#8ab4ff" stroke-width="2"/>
        <circle cx="75" cy="0" r="4" fill="#8ab4ff" opacity=".2"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle><circle cx="104" cy="0" r="9" fill="#0a0b16" stroke="#8ab4ff" stroke-width="2"/>
        <circle cx="104" cy="0" r="4" fill="#8ab4ff" opacity=".2"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" begin="2.4000000000000004s" repeatCount="indefinite"/></circle>
      <circle r="3.2" fill="#fff"><animate attributeName="cx" values="16;104" dur="3.2s" repeatCount="indefinite"/></circle>
      <text x="16" y="26" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" fill="#a9a4b8">visit</text><text x="45" y="-18" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" fill="#a9a4b8">connect</text><text x="75" y="26" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" fill="#a9a4b8">msg</text><text x="104" y="-18" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" fill="#a9a4b8">follow</text>
    </g></g>
    <path d="M 150 30 V 206" stroke="#f7f5f0" stroke-opacity=".07"/>

    <g class="rise" style="animation-delay:.05s">
      <text class="m" x="170" y="42" font-size="11" letter-spacing="2.2" fill="#8ab4ff">CHROME EXTENSION · CADENCES</text>
    </g>
    <g class="rise" style="animation-delay:.15s">
      <text class="t" x="168" y="80" font-size="29" font-weight="700" fill="#f7f5f0" letter-spacing=".3">OutreachOS</text>
    </g>
    <g class="rise" style="animation-delay:.3s">
      <text class="t" x="170" y="110" font-size="13.5" fill="#a9a4b8">Multi-step LinkedIn cadence engine: visit, connect,</text>
      <text class="t" x="170" y="130" font-size="13.5" fill="#a9a4b8">message, follow up. Sequenced with delays, daily caps and</text>
      <text class="t" x="170" y="150" font-size="13.5" fill="#a9a4b8">warm-up, running in your own browser session.</text>
    </g>
    <g class="rise" style="animation-delay:.45s"><g transform="translate(170 190)"><rect width="87" height="22" rx="11" fill="#8ab4ff" fill-opacity=".09" stroke="#8ab4ff" stroke-opacity=".28"/><text x="43.5" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">JavaScript</text></g><g transform="translate(264 190)"><rect width="87" height="22" rx="11" fill="#8ab4ff" fill-opacity=".09" stroke="#8ab4ff" stroke-opacity=".28"/><text x="43.5" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">Chrome MV3</text></g><g transform="translate(358 190)"><rect width="114.60000000000001" height="22" rx="11" fill="#8ab4ff" fill-opacity=".09" stroke="#8ab4ff" stroke-opacity=".28"/><text x="57.300000000000004" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">Service Worker</text></g></g>

    <g transform="translate(454.9 24)">
      <rect width="123.1" height="24" rx="12" fill="#8ab4ff" fill-opacity=".1" stroke="#8ab4ff" stroke-opacity=".35"/>
      <circle class="pulse" cx="14" cy="12" r="4" fill="#8ab4ff"/>
      <text class="m" x="24" y="16.5" font-size="11" letter-spacing="1.2" fill="#f7f5f0">OPEN SOURCE</text>
    </g>
    <text class="m" x="576" y="186" text-anchor="end" font-size="11.5" fill="#8ab4ff" opacity=".9">github.com/mananshah2254/OutreachOS ↗</text>
  </g>
  <rect x=".75" y=".75" width="598.5" height="234.5" rx="15.5" fill="none" stroke="#f7f5f0" stroke-opacity=".09" stroke-width="1.5"/>
  <rect x=".75" y=".75" width="598.5" height="234.5" rx="15.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
