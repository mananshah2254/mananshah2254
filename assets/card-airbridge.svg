<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 236" width="600" height="236" role="img" aria-label="AirBridge: Flick your wrist and a file leaves the Mac for a nearby iPhone. Core Motion gesture, Bonjour discovery, X25519 and AES-GCM, SHA-256 verified on arrival.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0b16"/><stop offset="1" stop-color="#11132a"/></linearGradient>
    <radialGradient id="glow" cx="12%" cy="40%" r="45%"><stop offset="0" stop-color="#6fd3e8" stop-opacity=".22"/><stop offset="1" stop-color="#6fd3e8" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6fd3e8" stop-opacity="0"/><stop offset=".5" stop-color="#6fd3e8" stop-opacity=".9"/><stop offset="1" stop-color="#6fd3e8" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-600 0;600 0" dur="7.4s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="clip"><rect width="600" height="236" rx="16"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
    .rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="600" height="236" fill="url(#bg)"/>
    <rect width="600" height="236" fill="url(#glow)"/>
    <g opacity=".05" stroke="#f7f5f0"><path d="M 0 0 V 236"/><path d="M 40 0 V 236"/><path d="M 80 0 V 236"/><path d="M 120 0 V 236"/><path d="M 160 0 V 236"/><path d="M 200 0 V 236"/><path d="M 240 0 V 236"/><path d="M 280 0 V 236"/><path d="M 320 0 V 236"/><path d="M 360 0 V 236"/><path d="M 400 0 V 236"/><path d="M 440 0 V 236"/><path d="M 480 0 V 236"/><path d="M 520 0 V 236"/><path d="M 560 0 V 236"/><path d="M 600 0 V 236"/><path d="M 0 0 H 600"/><path d="M 0 40 H 600"/><path d="M 0 80 H 600"/><path d="M 0 120 H 600"/><path d="M 0 160 H 600"/><path d="M 0 200 H 600"/></g>
    <g transform="translate(22 58)">
    <path id="abArc" d="M 22 78 Q 60 -6 98 60" fill="none"/>
    <path d="M 22 78 Q 60 -6 98 60" fill="none" stroke="#6fd3e8" stroke-opacity=".22" stroke-dasharray="3 6"/>
    <rect x="6" y="70" width="32" height="22" rx="4" fill="#0a0b16" stroke="#6fd3e8" stroke-width="1.6"/><path d="M 2 96 H 42" stroke="#6fd3e8" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="88" y="56" width="20" height="36" rx="5" fill="#0a0b16" stroke="#6fd3e8" stroke-width="1.6"/>
    <g transform="translate(60 100)"><rect x="-9" y="-11" width="18" height="22" rx="5" fill="none" stroke="#6fd3e8" stroke-opacity=".6" stroke-width="1.4"/><path d="M -5 -16 H 5 M -5 16 H 5" stroke="#6fd3e8" stroke-opacity=".6" stroke-width="1.4" stroke-linecap="round"/>
      <circle r="3" fill="#6fd3e8"><animate attributeName="r" values="3;9;3" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0;.9" dur="2.8s" repeatCount="indefinite"/></circle></g>
    <g>
      <animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#abArc"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.8;1" dur="2.8s" repeatCount="indefinite"/>
      <path d="M -6 -8 H 3 L 7 -4 V 8 H -6 Z" fill="#6fd3e8"/>
    </g></g>
    <path d="M 150 30 V 206" stroke="#f7f5f0" stroke-opacity=".07"/>

    <g class="rise" style="animation-delay:.05s">
      <text class="m" x="170" y="42" font-size="11" letter-spacing="2.2" fill="#6fd3e8">WATCH · MAC · iPHONE</text>
    </g>
    <g class="rise" style="animation-delay:.15s">
      <text class="t" x="168" y="80" font-size="29" font-weight="700" fill="#f7f5f0" letter-spacing=".3">AirBridge</text>
    </g>
    <g class="rise" style="animation-delay:.3s">
      <text class="t" x="170" y="110" font-size="13.5" fill="#a9a4b8">Flick your wrist and a file leaves the Mac for a nearby</text>
      <text class="t" x="170" y="130" font-size="13.5" fill="#a9a4b8">iPhone. Core Motion gesture, Bonjour discovery, X25519 and</text>
      <text class="t" x="170" y="150" font-size="13.5" fill="#a9a4b8">AES-GCM, SHA-256 verified on arrival.</text>
    </g>
    <g class="rise" style="animation-delay:.45s"><g transform="translate(170 190)"><rect width="52.5" height="22" rx="11" fill="#6fd3e8" fill-opacity=".09" stroke="#6fd3e8" stroke-opacity=".28"/><text x="26.25" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">Swift</text></g><g transform="translate(229.5 190)"><rect width="66.30000000000001" height="22" rx="11" fill="#6fd3e8" fill-opacity=".09" stroke="#6fd3e8" stroke-opacity=".28"/><text x="33.150000000000006" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">watchOS</text></g><g transform="translate(302.8 190)"><rect width="93.9" height="22" rx="11" fill="#6fd3e8" fill-opacity=".09" stroke="#6fd3e8" stroke-opacity=".28"/><text x="46.95" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">Core Motion</text></g><g transform="translate(403.70000000000005 190)"><rect width="135.3" height="22" rx="11" fill="#6fd3e8" fill-opacity=".09" stroke="#6fd3e8" stroke-opacity=".28"/><text x="67.65" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">Network.framework</text></g></g>

    <g transform="translate(471.1 24)">
      <rect width="106.89999999999999" height="24" rx="12" fill="#6fd3e8" fill-opacity=".1" stroke="#6fd3e8" stroke-opacity=".35"/>
      <circle class="pulse" cx="14" cy="12" r="4" fill="#6fd3e8"/>
      <text class="m" x="24" y="16.5" font-size="11" letter-spacing="1.2" fill="#f7f5f0">PROTOTYPE</text>
    </g>
    <text class="m" x="576" y="186" text-anchor="end" font-size="11.5" fill="#6fd3e8" opacity=".9">open source on GitHub ↗</text>
  </g>
  <rect x=".75" y=".75" width="598.5" height="234.5" rx="15.5" fill="none" stroke="#f7f5f0" stroke-opacity=".09" stroke-width="1.5"/>
  <rect x=".75" y=".75" width="598.5" height="234.5" rx="15.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
