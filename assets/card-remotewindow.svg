<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 236" width="600" height="236" role="img" aria-label="Remote Window: Share one Mac window, not your whole screen. A native host streams it with app audio to any phone or browser. Viewers open a link and you approve each one.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0b16"/><stop offset="1" stop-color="#11132a"/></linearGradient>
    <radialGradient id="glow" cx="12%" cy="40%" r="45%"><stop offset="0" stop-color="#b4e86a" stop-opacity=".22"/><stop offset="1" stop-color="#b4e86a" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b4e86a" stop-opacity="0"/><stop offset=".5" stop-color="#b4e86a" stop-opacity=".9"/><stop offset="1" stop-color="#b4e86a" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-600 0;600 0" dur="6.6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="clip"><rect width="600" height="236" rx="16"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
    .rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="600" height="236" fill="url(#bg)"/>
    <rect width="600" height="236" fill="url(#glow)"/>
    <g opacity=".05" stroke="#f7f5f0"><path d="M 0 0 V 236"/><path d="M 40 0 V 236"/><path d="M 80 0 V 236"/><path d="M 120 0 V 236"/><path d="M 160 0 V 236"/><path d="M 200 0 V 236"/><path d="M 240 0 V 236"/><path d="M 280 0 V 236"/><path d="M 320 0 V 236"/><path d="M 360 0 V 236"/><path d="M 400 0 V 236"/><path d="M 440 0 V 236"/><path d="M 480 0 V 236"/><path d="M 520 0 V 236"/><path d="M 560 0 V 236"/><path d="M 600 0 V 236"/><path d="M 0 0 H 600"/><path d="M 0 40 H 600"/><path d="M 0 80 H 600"/><path d="M 0 120 H 600"/><path d="M 0 160 H 600"/><path d="M 0 200 H 600"/></g>
    <g transform="translate(22 58)">
    <rect x="8" y="22" width="78" height="56" rx="7" fill="#101a12" stroke="#b4e86a" stroke-opacity=".35" stroke-width="1.5"/>
    <rect x="16" y="32" width="26" height="16" rx="3" fill="#b4e86a" opacity=".12"/>
    <rect x="16" y="54" width="40" height="14" rx="3" fill="#b4e86a" opacity=".12"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;34 6;34 6;0 0" keyTimes="0;.15;.5;.85;1" dur="4.6s" repeatCount="indefinite"/>
      <rect x="46" y="30" width="32" height="22" rx="4" fill="#b4e86a"/>
      <circle cx="51" cy="35" r="1.4" fill="#0a0b16"/><circle cx="56" cy="35" r="1.4" fill="#0a0b16"/>
      <path d="M 51 42 H 72 M 51 46.5 H 66" stroke="#0a0b16" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <rect x="76" y="26" width="38" height="68" rx="8" fill="none" stroke="#b4e86a" stroke-width="1.8" opacity=".9"/>
    <path d="M 90 88 H 100" stroke="#b4e86a" stroke-width="1.8" stroke-linecap="round"/></g>
    <path d="M 150 30 V 206" stroke="#f7f5f0" stroke-opacity=".07"/>

    <g class="rise" style="animation-delay:.05s">
      <text class="m" x="170" y="42" font-size="11" letter-spacing="2.2" fill="#b4e86a">macOS APP · WEBRTC</text>
    </g>
    <g class="rise" style="animation-delay:.15s">
      <text class="t" x="168" y="80" font-size="29" font-weight="700" fill="#f7f5f0" letter-spacing=".3">Remote Window</text>
    </g>
    <g class="rise" style="animation-delay:.3s">
      <text class="t" x="170" y="110" font-size="13.5" fill="#a9a4b8">Share one Mac window, not your whole screen. A native host</text>
      <text class="t" x="170" y="130" font-size="13.5" fill="#a9a4b8">streams it with app audio to any phone or browser. Viewers</text>
      <text class="t" x="170" y="150" font-size="13.5" fill="#a9a4b8">open a link and you approve each one.</text>
    </g>
    <g class="rise" style="animation-delay:.45s"><g transform="translate(170 190)"><rect width="52.5" height="22" rx="11" fill="#b4e86a" fill-opacity=".09" stroke="#b4e86a" stroke-opacity=".28"/><text x="26.25" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">Swift</text></g><g transform="translate(229.5 190)"><rect width="59.400000000000006" height="22" rx="11" fill="#b4e86a" fill-opacity=".09" stroke="#b4e86a" stroke-opacity=".28"/><text x="29.700000000000003" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">WebRTC</text></g><g transform="translate(295.9 190)"><rect width="87" height="22" rx="11" fill="#b4e86a" fill-opacity=".09" stroke="#b4e86a" stroke-opacity=".28"/><text x="43.5" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">TypeScript</text></g><g transform="translate(389.9 190)"><rect width="80.1" height="22" rx="11" fill="#b4e86a" fill-opacity=".09" stroke="#b4e86a" stroke-opacity=".28"/><text x="40.05" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#f7f5f0" opacity=".85">Signaling</text></g></g>

    <g transform="translate(511.6 24)">
      <rect width="66.4" height="24" rx="12" fill="#39d353" fill-opacity=".1" stroke="#39d353" stroke-opacity=".35"/>
      <circle class="pulse" cx="14" cy="12" r="4" fill="#39d353"/>
      <text class="m" x="24" y="16.5" font-size="11" letter-spacing="1.2" fill="#f7f5f0">LIVE</text>
    </g>
    <text class="m" x="576" y="186" text-anchor="end" font-size="11.5" fill="#b4e86a" opacity=".9">remotewindow.app ↗</text>
  </g>
  <rect x=".75" y=".75" width="598.5" height="234.5" rx="15.5" fill="none" stroke="#f7f5f0" stroke-opacity=".09" stroke-width="1.5"/>
  <rect x=".75" y=".75" width="598.5" height="234.5" rx="15.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
