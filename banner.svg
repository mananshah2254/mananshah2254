<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Manan Shah, AI Engineer at PayPal">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0a0b16"/>
      <stop offset="55%"  stop-color="#11132a"/>
      <stop offset="100%" stop-color="#1b1430"/>
    </linearGradient>

    <radialGradient id="dusk" cx="82%" cy="12%" r="70%">
      <stop offset="0%"   stop-color="#ffab70" stop-opacity=".30"/>
      <stop offset="45%"  stop-color="#ff7d5c" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffab70" stop-opacity="0"/>
    </radialGradient>

    <!-- light sweeping across the wordmark -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f7f5f0"/>
      <stop offset="42%"  stop-color="#f7f5f0"/>
      <stop offset="50%"  stop-color="#ffc79b"/>
      <stop offset="58%"  stop-color="#f7f5f0"/>
      <stop offset="100%" stop-color="#f7f5f0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffab70" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffab70" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffab70" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="trailFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffab70" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffab70" stop-opacity=".85"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="tiny" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- the arc the comet flies: a long shallow climb, like the portfolio -->
    <path id="arc" d="M -40 296 C 230 272, 430 262, 640 272 S 1010 296, 1240 252"/>

    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#sky)"/>
    <rect width="1200" height="320" fill="url(#dusk)"/>

    <!-- starfield -->
    <g fill="#f7f5f0">
      <circle cx="104"  cy="52"  r="1.3" opacity=".55"><animate attributeName="opacity" values=".15;.75;.15" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="232"  cy="96"  r="1"   opacity=".40"><animate attributeName="opacity" values=".10;.55;.10" dur="5.3s" repeatCount="indefinite"/></circle>
      <circle cx="388"  cy="38"  r="1.1" opacity=".50"><animate attributeName="opacity" values=".12;.62;.12" dur="6.2s" repeatCount="indefinite"/></circle>
      <circle cx="604"  cy="62"  r="1"   opacity=".35"><animate attributeName="opacity" values=".10;.50;.10" dur="4.7s" repeatCount="indefinite"/></circle>
      <circle cx="757"  cy="30"  r="1.2" opacity=".45"><animate attributeName="opacity" values=".14;.68;.14" dur="5.9s" repeatCount="indefinite"/></circle>
      <circle cx="905"  cy="84"  r="1"   opacity=".38"><animate attributeName="opacity" values=".10;.52;.10" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="1064" cy="46"  r="1.3" opacity=".52"><animate attributeName="opacity" values=".16;.72;.16" dur="6.8s" repeatCount="indefinite"/></circle>
      <circle cx="1148" cy="128" r="1"   opacity=".30"><animate attributeName="opacity" values=".08;.45;.08" dur="5.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- horizon haze -->
    <ellipse cx="880" cy="300" rx="520" ry="120" fill="#ff8a5c" opacity=".07" filter="url(#soft)"/>

    <!-- the flight path, drawn on once then held -->
    <use href="#arc" xlink:href="#arc" fill="none" stroke="#ffab70" stroke-opacity=".12" stroke-width="1.2" stroke-dasharray="5 11"/>

    <!-- comet: the mail trail, the motif from trailmails.com -->
    <g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.86;1" dur="9s" repeatCount="indefinite"/>
        <path d="M -118 0 L 0 0" stroke="url(#trailFade)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <circle r="9" fill="#ffab70" opacity=".30" filter="url(#tiny)"/>
        <circle r="3.4" fill="#fff3e6"/>
        <animateMotion dur="9s" repeatCount="indefinite" rotate="auto">
          <mpath href="#arc" xlink:href="#arc"/>
        </animateMotion>
      </g>
    </g>

    <!-- content -->
    <g text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">

      <text x="600" y="98" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
            font-size="15" letter-spacing="7" fill="#ffab70" opacity=".92">&#60;/&#62;   BUILDING IN PUBLIC</text>

      <text x="600" y="186" font-size="78" font-weight="700" letter-spacing="7" fill="url(#shine)">MANAN SHAH</text>

      <rect x="470" y="208" width="260" height="2" rx="1" fill="url(#rule)"/>

      <!-- rotating subtitle: four lines, one 3s slot each in a 12s cycle -->
      <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2.5" fill="#dcd8d0">
        <text x="600" y="252" opacity="0">AI ENGINEER  &#183;  PAYPAL  &#183;  SAN FRANCISCO<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.035;0.21;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/></text>
        <text x="600" y="252" opacity="0">RAG PIPELINES THAT HOLD UP IN PRODUCTION<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.035;0.21;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>
        <text x="600" y="252" opacity="0">AGENTIC SYSTEMS  &#183;  EMBEDDINGS  &#183;  BACKENDS<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.035;0.21;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/></text>
        <text x="600" y="252" opacity="0">THREE PRODUCTS LIVE ON THE INTERNET<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.035;0.21;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/></text>
      </g>
    </g>

    <rect width="1200" height="320" rx="18" fill="none" stroke="#ffab70" stroke-opacity=".18" stroke-width="1.5"/>
  </g>
</svg>
